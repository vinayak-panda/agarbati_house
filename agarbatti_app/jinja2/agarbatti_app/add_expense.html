{% extends 'agarbatti_app/base.html' %}
{% block title %}Add Expense{% endblock %}
{% block page_title %}Add Expense{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-7">
<div class="card"><div class="card-body p-4">
  <form method="POST">{{ csrf_input|safe }}
    <div class="row g-3">
      <div class="col-12"><label class="form-label fw-600">Title *</label><input type="text" name="title" class="form-control" required placeholder="e.g. Monthly Salary, Electricity Bill"></div>
      <div class="col-md-6">
        <label class="form-label fw-600">Category</label>
        <select name="category" class="form-select">
          {% for v, l in [('salary','Salary'),('utilities','Utilities'),('raw_material','Raw Material'),('transport','Transport'),('maintenance','Maintenance'),('marketing','Marketing'),('other','Other')] %}
          <option value="{{ v }}">{{ l }}</option>{% endfor %}
        </select>
      </div>
      <div class="col-md-6"><label class="form-label fw-600">Amount (₹) *</label><input type="number" name="amount" class="form-control" required step="0.01" min="0"></div>
      <div class="col-md-6"><label class="form-label fw-600">Date</label><input type="date" name="date" class="form-control" value="{{ now().strftime('%Y-%m-%d') }}"></div>
      <div class="col-12"><label class="form-label fw-600">Description</label><textarea name="description" class="form-control" rows="2"></textarea></div>
      <div class="col-12 d-flex gap-2 justify-content-end">
        <a href="{{ url('expenses') }}" class="btn btn-outline-secondary">Cancel</a>
        <button type="submit" class="btn btn-primary"><i class="fas fa-save me-2"></i>Save Expense</button>
      </div>
    </div>
  </form>
</div></div>
</div></div>
{% endblock %}
