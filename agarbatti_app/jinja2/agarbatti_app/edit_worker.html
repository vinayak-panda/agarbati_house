{% extends 'agarbatti_app/base.html' %}
{% block title %}Edit Worker{% endblock %}
{% block page_title %}Edit Worker{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-7">
<div class="card"><div class="card-body p-4">
  <form method="POST">{{ csrf_input|safe }}
    <div class="row g-3">
      <div class="col-md-6"><label class="form-label fw-600">Full Name *</label><input type="text" name="name" class="form-control" required value="{{ worker.name }}"></div>
      <div class="col-md-6"><label class="form-label fw-600">Phone</label><input type="text" name="phone" class="form-control" value="{{ worker.phone or '' }}"></div>
      <div class="col-md-6"><label class="form-label fw-600">Role</label><input type="text" name="role" class="form-control" value="{{ worker.role or '' }}"></div>
      <div class="col-md-6"><label class="form-label fw-600">Monthly Salary (₹)</label><input type="number" name="salary" class="form-control" value="{{ worker.salary }}" step="0.01"></div>
      <div class="col-12"><label class="form-label fw-600">Address</label><textarea name="address" class="form-control" rows="2">{{ worker.address or '' }}</textarea></div>
      <div class="col-12">
        <div class="form-check form-switch">
          <input class="form-check-input" type="checkbox" name="is_active" id="isActive" {% if worker.is_active %}checked{% endif %}>
          <label class="form-check-label fw-600" for="isActive">Active Worker</label>
        </div>
      </div>
      <div class="col-12 d-flex gap-2 justify-content-end">
        <a href="{{ url('workers') }}" class="btn btn-outline-secondary">Cancel</a>
        <button type="submit" class="btn btn-primary"><i class="fas fa-save me-2"></i>Update Worker</button>
      </div>
    </div>
  </form>
</div></div>
</div></div>
{% endblock %}
