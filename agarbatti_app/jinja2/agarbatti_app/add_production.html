{% extends 'agarbatti_app/base.html' %}
{% block title %}Log Production{% endblock %}
{% block page_title %}Log Production Batch{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-7">
<div class="card"><div class="card-body p-4">
  <form method="POST">{{ csrf_input|safe }}
    <div class="row g-3">
      <div class="col-12">
        <label class="form-label fw-600">Product *</label>
        <select name="product" class="form-select" required>
          <option value="">-- Select Product --</option>
          {% for p in products %}<option value="{{ p.id }}">{{ p.name }}</option>{% endfor %}
        </select>
      </div>
      <div class="col-md-6"><label class="form-label fw-600">Quantity Produced (Packs) *</label><input type="number" name="quantity_produced" class="form-control" required min="1"></div>
      <div class="col-md-6"><label class="form-label fw-600">Production Cost (₹)</label><input type="number" name="production_cost" class="form-control" value="0" step="0.01" min="0"></div>
      <div class="col-md-6">
        <label class="form-label fw-600">Status</label>
        <select name="status" class="form-select">
          <option value="completed">Completed</option>
          <option value="in_progress">In Progress</option>
        </select>
      </div>
      <div class="col-12"><label class="form-label fw-600">Notes</label><textarea name="notes" class="form-control" rows="2" placeholder="Any notes about this batch..."></textarea></div>
      <div class="col-12 d-flex gap-2 justify-content-end">
        <a href="{{ url('production') }}" class="btn btn-outline-secondary">Cancel</a>
        <button type="submit" class="btn btn-primary"><i class="fas fa-save me-2"></i>Save Batch</button>
      </div>
    </div>
  </form>
</div></div>
</div></div>
{% endblock %}
