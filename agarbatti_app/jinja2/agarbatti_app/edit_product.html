{% extends 'agarbatti_app/base.html' %}
{% block title %}Edit Product - Agarbatti House{% endblock %}
{% block page_title %}Edit Product{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-9">
<div class="card"><div class="card-body p-4">
  <form method="POST">
    {{ csrf_input|safe }}
    <div class="row g-3">
      <div class="col-md-6"><label class="form-label fw-600">Product Name *</label><input type="text" name="name" class="form-control" required value="{{ product.name }}"></div>
      <div class="col-md-6"><label class="form-label fw-600">Fragrance</label><input type="text" name="fragrance" class="form-control" value="{{ product.fragrance or '' }}"></div>
      <div class="col-md-4">
        <label class="form-label fw-600">Category</label>
        <select name="category" class="form-select">
          <option value="">-- Select --</option>
          {% for c in categories %}<option value="{{ c.id }}" {% if product.category_id == c.id %}selected{% endif %}>{{ c.name }}</option>{% endfor %}
        </select>
      </div>
      <div class="col-md-4"><label class="form-label fw-600">Length (cm)</label><input type="number" name="length_cm" class="form-control" value="{{ product.length_cm }}" step="0.5"></div>
      <div class="col-md-4"><label class="form-label fw-600">Burn Time (min)</label><input type="number" name="burn_time_min" class="form-control" value="{{ product.burn_time_min }}"></div>
      <div class="col-md-3"><label class="form-label fw-600">Sticks Per Pack</label><input type="number" name="sticks_per_pack" class="form-control" value="{{ product.sticks_per_pack }}"></div>
      <div class="col-md-3"><label class="form-label fw-600">Packs in Stock</label><input type="number" name="packs_in_stock" class="form-control" value="{{ product.packs_in_stock }}"></div>
      <div class="col-md-3"><label class="form-label fw-600">Purchase Price (₹) *</label><input type="number" name="purchase_price" class="form-control" required step="0.01" value="{{ product.purchase_price }}"></div>
      <div class="col-md-3"><label class="form-label fw-600">Selling Price (₹) *</label><input type="number" name="selling_price" class="form-control" required step="0.01" value="{{ product.selling_price }}"></div>
      <div class="col-md-4"><label class="form-label fw-600">Low Stock Threshold</label><input type="number" name="low_stock_threshold" class="form-control" value="{{ product.low_stock_threshold }}"></div>
      <div class="col-12"><label class="form-label fw-600">Description</label><textarea name="description" class="form-control" rows="2">{{ product.description or '' }}</textarea></div>
      <div class="col-12 d-flex gap-2 justify-content-end">
        <a href="{{ url('products') }}" class="btn btn-outline-secondary">Cancel</a>
        <button type="submit" class="btn btn-primary"><i class="fas fa-save me-2"></i>Update Product</button>
      </div>
    </div>
  </form>
</div></div>
</div></div>
{% endblock %}
